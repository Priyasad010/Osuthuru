# Optional HTTPS for testing on a phone. It is active only after
# bin/setup_https.ps1 has created the certificate; otherwise nothing changes.
<IfFile "/var/www/html/docker/certs/server.crt">
    <IfModule !socache_shmcb_module>
        LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
    </IfModule>
    <IfModule !ssl_module>
        LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
    </IfModule>

    Listen 443
    SSLSessionCache shmcb:/tmp/ssl_scache(512000)

    <VirtualHost *:443>
        DocumentRoot /var/www/html/public
        SSLEngine on
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLCertificateFile /var/www/html/docker/certs/server.crt
        SSLCertificateKeyFile /var/www/html/docker/certs/server.key
    </VirtualHost>
</IfFile>

; Production settings: errors go to the log, never to the visitor
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

upload_max_filesize = 3M
post_max_size = 14M
memory_limit = 192M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

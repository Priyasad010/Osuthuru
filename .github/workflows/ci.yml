name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_secret
          MYSQL_DATABASE: osuthuru
          MYSQL_USER: app
          MYSQL_PASSWORD: app_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_secret"
          --health-interval=5s --health-timeout=5s --health-retries=30
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd, zip, curl
          coverage: none
      - name: Install packages
        run: composer install --no-interaction --no-progress
      - name: Configure the environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/; s/^MAIL_HOST=.*/MAIL_HOST=127.0.0.1/' .env
      - name: Check PHP syntax
        run: |
          find src templates lang bin routes public/index.php tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: Fresh install with demo data
        run: |
          php bin/migrate.php
          php bin/seed.php --demo
          php bin/migrate.php

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install packages
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q

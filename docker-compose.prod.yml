# Production: use this file on its own, never together with docker-compose.yml.
#   docker compose -f docker-compose.prod.yml up -d
# Only Caddy is reachable from outside; the database, the website and the ML
# service stay inside the private network. See docs/HOSTING.md.
name: osuthuru

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./docker/prod/php.ini:/usr/local/etc/php/conf.d/zz-production.ini:ro
      - ./docker/prod/behind-proxy.conf:/etc/apache2/conf-enabled/zz-behind-proxy.conf:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    command: ["sh", "-c", "a2enmod -q remoteip headers && exec apache2-foreground"]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:-osuthuru}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # $$ leaves the variable to the shell inside the container
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging: *logging

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./ml:/app
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-osuthuru}
      DB_ML_RO_USER: ${DB_ML_RO_USER:-ml_ro}
      DB_ML_RO_PASS: ${DB_ML_RO_PASS:?set DB_ML_RO_PASS in .env}
    depends_on:
      - db
    logging: *logging

volumes:
  db_data:
  vendor_data:
  caddy_data:
  caddy_config:

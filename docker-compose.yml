services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: suwoda_web
    restart: unless-stopped
    ports:
      - "8080:80" # open to the local network so phones can use the shop
    volumes:
      - .:/var/www/html
      # Composer packages live in a Docker volume: much faster than the Windows folder
      - vendor_data:/var/www/html/vendor
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_DEBUG=${APP_DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - suwoda-network

  db:
    image: mysql:8.0
    container_name: suwoda_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-suwoda}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASS:-app_secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/01-init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - suwoda-network

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: suwoda_ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ml:/app
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-suwoda}
      DB_ML_RO_USER: ${DB_ML_RO_USER:-ml_ro}
      DB_ML_RO_PASS: ${DB_ML_RO_PASS:-ml_ro_secret}
    depends_on:
      - db
    networks:
      - suwoda-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: suwoda_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Web UI
      - "127.0.0.1:1025:1025" # SMTP
    networks:
      - suwoda-network

volumes:
  db_data:
  vendor_data:

networks:
  suwoda-network:
    driver: bridge
